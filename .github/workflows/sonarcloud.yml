name: SonarQube Cloud
on:
  push:
    branches:
      - github
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build ipscan
        run: |
          mkdir -p libs
          cd ..
          git clone --depth 1 --branch patched https://github.com/marek22k/ipscan.git
          cd ipscan
          git tag 3.9.2SVN
          ./gradlew any
          cp "build/libs/ipscan-any-3.9.2SVN.jar" "../ipscan-plugins-mirror/libs/ipscan-any-3.9.2.jar"
          cd "../ipscan-plugins-mirror"
          ./gradlew properties

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar --info
