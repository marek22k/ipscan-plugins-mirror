name: Coverity Scan

on:
  push:
    branches: [ "github" ]
  schedule:
    - cron: '19 8 * * 5'

jobs:
  coverity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build ipscan
      run: |
        mkdir -p libs
        cd ..
        git clone --depth 1 --branch patched https://github.com/marek22k/ipscan.git
        cd ipscan
        git tag 3.9.2SVN
        ./gradlew any
        cp "build/libs/ipscan-any-3.9.2SVN.jar" "../ipscan-plugins-mirror/libs/ipscan-any-3.9.2.jar"
        cd "../ipscan-plugins-mirror"
        ./gradlew properties

    - uses: vapier/coverity-scan-action@v1
      with:
        project: 'crazipscan-pluginsytrace'
        build_language: 'java'
        command: 'make proguardedJar'
        email: ${{ secrets.COVERITY_SCAN_EMAIL }}
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
