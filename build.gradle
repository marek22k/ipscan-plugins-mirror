plugins {
    id 'java'
    id 'org.gradlex.reproducible-builds' version '1.0'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.gradlex.reproducible-builds'

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly files("${rootProject.projectDir}/libs/ipscan-any-3.9.2.jar")
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of 17
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            resources.srcDirs = ['resources']
        }
    }

    jar {
        dependsOn check
        from {
            configurations.runtimeClasspath.collect {
                (it.isDirectory() ? it : zipTree(it)).matching {
                    exclude('META-INF/versions/**')
                    exclude('META-INF/maven/**')
                    exclude('META-INF/proguard/**') // not currently used, see https://github.com/Guardsquare/proguard/issues/337
                    exclude('META-INF/LICENSE*')
                }
            }
        }
        duplicatesStrategy = DuplicatesStrategy.FAIL
        includeEmptyDirs = false
    }
}
