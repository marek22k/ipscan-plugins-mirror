plugins {
    id 'java'
    id 'pmd'
    id 'org.gradlex.reproducible-builds' version '1.1'
    id 'io.github.sgtsilvio.gradle.proguard' version '0.8.0'
    id 'com.diffplug.spotless' version '8.0.0'
    id 'com.github.spotbugs' version '6.4.4'
    id 'com.github.ben-manes.versions' version '0.53.0'
}

repositories {
    mavenCentral()
}

dependencyUpdates {
    gradleReleaseChannel="current"
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.gradlex.reproducible-builds'
    apply plugin: 'io.github.sgtsilvio.gradle.proguard'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'com.github.spotbugs'

    repositories {
        mavenCentral()
    }

    dependencies {
        spotbugs 'com.github.spotbugs:spotbugs:4.9.8'
        spotbugsPlugins 'com.mebigfatguy.fb-contrib:fb-contrib:7.6.15'

        compileOnly 'com.github.spotbugs:spotbugs-annotations:4.9.8'
        compileOnly files("${rootProject.projectDir}/libs/ipscan-any-3.9.2.jar")
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of 17
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            resources.srcDirs = ['resources']
        }
    }

    spotless {
        format 'misc', {
            // define the files to apply `misc` to
            target '*.gradle', '.gitattributes', '.gitignore'

            // define the steps to apply to those files
            trimTrailingWhitespace()
            leadingTabsToSpaces() // or leadingTabsToSpaces. Takes an integer argument if you don't like 4
            endWithNewline()
        }
        java {
            removeUnusedImports()
            forbidWildcardImports()

            eclipse()
                .sortMembersEnabled(true)
                .sortMembersOrder("T,SF,SI,SM,F,I,C,M")
                .sortMembersVisibilityOrderEnabled(true)
                .sortMembersVisibilityOrder("B,R,D,V")
                .configFile("${rootProject.projectDir}/eclipse-jdt.xml")
        }
    }

    pmd {
        consoleOutput = true
        toolVersion = '7.8.0'
        ruleSetFiles = files 'pmd.xml'
    }

    spotbugs {
        effort = com.github.spotbugs.snom.Effort.valueOf 'MAX'
        reportLevel = com.github.spotbugs.snom.Confidence.valueOf 'LOW'
        excludeFilter = file "${rootProject.projectDir}/spotbugs-exclude.xml"
    }

    jar {
        enabled = false
    }

    task fatJar(type: Jar) {
        dependsOn check
        from {
            configurations.runtimeClasspath.collect {
                (it.isDirectory() ? it : zipTree(it)).matching {
                    exclude('META-INF/versions/**')
                    exclude('META-INF/maven/**')
                    exclude('META-INF/proguard/**') // not currently used, see https://github.com/Guardsquare/proguard/issues/337
                    exclude('META-INF/LICENSE*')
                }
            }
        }
        duplicatesStrategy = DuplicatesStrategy.FAIL
        includeEmptyDirs = false
        archiveClassifier = 'fatjar'
        with jar
    }

    task proguardedJar(type: io.github.sgtsilvio.gradle.proguard.ProguardTask) {
        dependsOn fatJar
        addInput {
            classpath.from(tasks.fatJar)
        }
        addOutput {
            archiveFile.set(project.layout.buildDirectory.file(
                project.provider { "libs/${project.name}-${project.version}.jar" }
            ))
        }
        addLibrary {
            classpath.from(configurations.compileClasspath)
        }

        jdkModules.add 'java.base'

        rulesFiles.from file("${rootProject.projectDir}/ipscan-plugins.pro")
    }
}
